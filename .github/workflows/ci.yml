name: CI

# 编译流水线：类型检查 + 单元测试 + 生产构建（PR 与 main 推送均触发）
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # 产物留档（不含 Pages 部署，部署见 deploy.yml）
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
